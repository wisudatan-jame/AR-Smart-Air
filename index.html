<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SMART AIR AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07172b;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #07172b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #loading h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    #loading p {
      font-size: 18px;
      margin: 0;
    }

    #error {
      display: none;
      color: #ff7777;
      margin-top: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <h1>❄️ SMART AIR</h1>
    <p id="loadingText">กำลังโหลดระบบ AR...</p>
    <div id="error"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-plane
        position="0 0.35 0.01"
        width="1.5"
        height="0.55"
        color="#07172b"
        opacity="0.90">
      </a-plane>

      <a-text
        value="SMART AIR"
        position="0 0.46 0.03"
        align="center"
        color="#ffffff"
        width="1.8">
      </a-text>

      <a-text
        value="25°C • OFF"
        position="0 0.25 0.03"
        align="center"
        color="#63d9ff"
        width="1.5">
      </a-text>

    </a-entity>

  </a-scene>

  <script>

    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#target");

    const loading = document.querySelector("#loading");
    const loadingText = document.querySelector("#loadingText");
    const error = document.querySelector("#error");

    scene.addEventListener("arReady", function () {

      loading.style.display = "none";

    });

    scene.addEventListener("arError", function (event) {

      loadingText.innerText = "ไม่สามารถเริ่มระบบ AR";

      error.style.display = "block";

      error.innerText =
        "กรุณาตรวจสอบ Camera และ targets.mind";

      console.error("MindAR Error:", event);

    });

    target.addEventListener("targetFound", function () {

      console.log("SMART AIR TARGET FOUND");

    });

    target.addEventListener("targetLost", function () {

      console.log("SMART AIR TARGET LOST");

    });

  </script>

</body>
</html>
