<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART AIR — AR Demo</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#07172b;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#07172b;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

#loading .logo{
  font-size:42px;
  font-weight:800;
}

#loading .sub{
  margin-top:12px;
  font-size:18px;
  opacity:.8;
}

#loading.hidden{display:none}

/* TOP */
#top{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 28px);
  max-width:430px;
  z-index:30;

  padding:13px 17px;
  border-radius:20px;

  background:rgba(5,20,40,.88);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(15px);

  color:white;
  display:none;
}

#top.show{display:block}

.topLine{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:18px;
  font-weight:bold;
}

.connected{
  font-size:11px;
  color:#54e39b;
}

.location{
  margin-top:5px;
  font-size:12px;
  color:#70dfff;
}

/* DASHBOARD */
#dashboard{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:calc(100% - 18px);
  max-width:430px;
  z-index:40;

  padding:17px;
  border-radius:28px;

  background:rgba(5,20,40,.94);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  backdrop-filter:blur(20px);

  color:white;
  display:none;
}

#dashboard.show{display:block}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:19px;
  font-weight:bold;
}

.power{
  padding:6px 12px;
  border-radius:20px;
  background:#26364a;
  font-size:12px;
}

.power.on{
  background:#11a86b;
}

/* TEMPERATURE */
.mainTemp{
  text-align:center;
  margin:3px 0 5px;
}

#setTemp{
  font-size:55px;
  font-weight:800;
}

.setLabel{
  text-align:center;
  font-size:11px;
  opacity:.65;
}

/* ROOM DATA */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:13px 0;
}

.stat{
  padding:10px;
  border-radius:14px;
  background:#102943;
  text-align:center;
}

.statValue{
  font-size:18px;
  font-weight:bold;
}

.statLabel{
  font-size:10px;
  opacity:.6;
  margin-top:2px;
}

/* BUTTONS */
.row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

button{
  flex:1;
  border:0;
  border-radius:14px;
  padding:13px 7px;
  color:white;
  font-size:15px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.tempBtn{
  background:#28527e;
  font-size:21px;
}

.onBtn{
  background:#11ad70;
}

.offBtn{
  background:#db4b4b;
}

.mode{
  background:#1c395d;
}

.mode.active{
  outline:2px solid #65ddff;
  background:#27577e;
}

.fan{
  background:#173454;
}

.fan.active{
  outline:2px solid #8eeaff;
}

/* TIMER */
.timer{
  margin-top:9px;
  padding:11px;
  border-radius:14px;
  background:#102943;
  text-align:center;
  font-size:13px;
}

#demoMessage{
  text-align:center;
  margin-top:9px;
  font-size:10px;
  color:#8ea4bb;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="logo">❄️ SMART AIR</div>
  <div class="sub">กำลังโหลดระบบ AR...</div>
</div>

<!-- TOP STATUS -->
<div id="top">

  <div class="topLine">
    <div class="brand">❄️ SMART AIR</div>
    <div id="connection" class="connected">● CONNECTED</div>
  </div>

  <div class="location">
    📍 Living Room · AR Device Detected
  </div>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="header">
    <div class="title">ควบคุมเครื่องปรับอากาศ</div>
    <div id="powerStatus" class="power">OFF</div>
  </div>

  <div class="mainTemp">
    <span id="setTemp">25</span>°C
  </div>

  <div class="setLabel">
    อุณหภูมิที่ตั้งไว้
  </div>

  <div class="row">
    <button class="tempBtn" onclick="changeTemp(-1)">−</button>
    <button class="tempBtn" onclick="changeTemp(1)">＋</button>
  </div>

  <div class="row">
    <button class="onBtn" onclick="turnOn()">🟢 เปิดแอร์</button>
    <button class="offBtn" onclick="turnOff()">🔴 ปิดแอร์</button>
  </div>

  <!-- ROOM STATUS -->
  <div class="stats">

    <div class="stat">
      <div id="roomTemp" class="statValue">27.5°C</div>
      <div class="statLabel">อุณหภูมิห้อง</div>
    </div>

    <div class="stat">
      <div class="statValue">62%</div>
      <div class="statLabel">ความชื้น</div>
    </div>

  </div>

  <!-- MODE -->
  <div class="row">

    <button id="cool" class="mode active"
            onclick="setMode('COOL')">
      ❄️ COOL
    </button>

    <button id="dry" class="mode"
            onclick="setMode('DRY')">
      💧 DRY
    </button>

    <button id="auto" class="mode"
            onclick="setMode('AUTO')">
      AUTO
    </button>

  </div>

  <!-- FAN -->
  <div class="row">

    <button id="fanAuto" class="fan active"
            onclick="setFan('AUTO')">
      AUTO
    </button>

    <button id="fanLow" class="fan"
            onclick="setFan('LOW')">
      LOW
    </button>

    <button id="fanMed" class="fan"
            onclick="setFan('MED')">
      MED
    </button>

    <button id="fanHigh" class="fan"
            onclick="setFan('HIGH')">
      HIGH
    </button>

  </div>

  <div class="timer">
    ⏱️ Timer: <strong id="timer">OFF</strong>
  </div>

  <div id="demoMessage">
    DEMO MODE — ยังไม่ได้เชื่อมต่อ Hardware
  </div>

</div>


<!-- AR -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity
    id="airTarget"
    mindar-image-target="targetIndex:0">

    <a-plane
      position="0 0.40 0.02"
      width="1.45"
      height=".55"
      color="#07172b"
      opacity=".88">
    </a-plane>

    <a-text
      value="❄ SMART AIR"
      position="0 .50 .04"
      align="center"
      color="#ffffff"
      width="1.8">
    </a-text>

    <a-text
      id="arStatus"
      value="25°C • OFF"
      position="0 .30 .04"
      align="center"
      color="#65ddff"
      width="1.5">
    </a-text>

  </a-entity>

</a-scene>


<script>

let power = false;
let setTemperature = 25;
let roomTemperature = 27.5;
let mode = "COOL";
let fan = "AUTO";

const loading = document.getElementById("loading");
const dashboard = document.getElementById("dashboard");
const top = document.getElementById("top");

const setTemp = document.getElementById("setTemp");
const roomTemp = document.getElementById("roomTemp");
const powerStatus = document.getElementById("powerStatus");
const arStatus = document.getElementById("arStatus");
const demoMessage = document.getElementById("demoMessage");

const scene = document.querySelector("a-scene");
const target = document.getElementById("airTarget");


/* AR READY */

scene.addEventListener("arReady", () => {

  loading.classList.add("hidden");

});


/* TARGET FOUND */

target.addEventListener("targetFound", () => {

  top.classList.add("show");
  dashboard.classList.add("show");

});


/* TARGET LOST */

target.addEventListener("targetLost", () => {

  top.classList.remove("show");
  dashboard.classList.remove("show");

});


/* POWER */

function turnOn(){

  power = true;

  demoMessage.innerText =
    "DEMO: ส่งคำสั่งเปิดเครื่องปรับอากาศ";

  updateUI();

}


function turnOff(){

  power = false;

  demoMessage.innerText =
    "DEMO: ส่งคำสั่งปิดเครื่องปรับอากาศ";

  updateUI();

}


/* TEMPERATURE */

function changeTemp(value){

  setTemperature += value;

  if(setTemperature < 16)
    setTemperature = 16;

  if(setTemperature > 30)
    setTemperature = 30;

  updateUI();

}


/* MODE */

function setMode(value){

  mode = value;

  document
    .querySelectorAll(".mode")
    .forEach(x => x.classList.remove("active"));

  document
    .getElementById(
      value === "COOL" ? "cool" :
      value === "DRY" ? "dry" : "auto"
    )
    .classList.add("active");

  demoMessage.innerText =
    "DEMO: Mode → " + value;

}


/* FAN */

function setFan(value){

  fan = value;

  document
    .querySelectorAll(".fan")
    .forEach(x => x.classList.remove("active"));

  const ids = {
    AUTO:"fanAuto",
    LOW:"fanLow",
    MED:"fanMed",
    HIGH:"fanHigh"
  };

  document
    .getElementById(ids[value])
    .classList.add("active");

  demoMessage.innerText =
    "DEMO: Fan Speed → " + value;

}


/* UPDATE */

function updateUI(){

  setTemp.innerText = setTemperature;

  roomTemp.innerText =
    roomTemperature.toFixed(1) + "°C";

  powerStatus.innerText =
    power ? "ON" : "OFF";

  powerStatus.classList.toggle("on", power);

  arStatus.setAttribute(
    "value",
    setTemperature + "°C • " +
    (power ? "ON" : "OFF")
  );

}


/* SIMULATE COOLING */

setInterval(() => {

  if(power && roomTemperature > setTemperature){

    roomTemperature -= .1;

    if(roomTemperature < setTemperature)
      roomTemperature = setTemperature;

    updateUI();

  }

}, 2000);


/* ERROR */

scene.addEventListener("arError", () => {

  loading.innerHTML = `
    <div class="logo">❌ SMART AIR</div>
    <div class="sub">
      ไม่สามารถเริ่มระบบ AR ได้
    </div>
  `;

});

</script>

</body>
</html>
