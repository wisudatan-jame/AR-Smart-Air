<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AR Smart Air</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#071a2f;color:#fff;text-align:center}
#loading h1{margin:0 0 12px;font-size:30px}#loading p{margin:0;font-size:16px}
#controlPanel{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(290px,calc(100vw - 36px));padding:20px;box-sizing:border-box;background:rgba(0,35,70,.94);color:#fff;border-radius:20px;text-align:center;z-index:10000;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.title{font-size:25px;font-weight:bold;margin-bottom:12px}#status{font-size:18px;margin:12px}#temperature{font-size:42px;font-weight:bold;margin:15px}
.tempRow{display:flex;gap:10px;align-items:center;justify-content:center}.tempRow button{width:54px;margin:0;padding:10px;font-size:24px}
button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
#onButton{background:#16a34a;color:#fff}#offButton{background:#dc2626;color:#fff}
.modeRow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.modeRow button{margin-top:0;padding:11px 5px;font-size:14px;background:#164e63;color:#fff}.demo{margin-top:12px;font-size:12px;opacity:.7}
</style></head>
<body>
<div id="loading"><h1>❄️ SMART AIR</h1><p id="loadingText">กำลังโหลดระบบ AR...</p></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<a-text value="SMART AIR" align="center" color="#00e5ff" width="2" position="0 0.6 0"></a-text>
<a-text id="arTemp" value="25°C" align="center" color="#fff" width="2" position="0 0.25 0"></a-text>
<a-text id="arStatus" value="OFF" align="center" color="#ff3333" width="2" position="0 -0.1 0"></a-text>
</a-entity></a-scene>
<div id="controlPanel">
<div class="title">❄️ SMART AIR</div><div id="status">🔴 สถานะ: OFF</div>
<div class="tempRow"><button id="minusButton">−</button><div id="temperature">25°C</div><button id="plusButton">＋</button></div>
<button id="onButton">🟢 เปิดแอร์</button><button id="offButton">🔴 ปิดแอร์</button>
<div class="modeRow"><button data-mode="COOL">❄️ COOL</button><button data-mode="FAN">💨 FAN</button><button data-mode="DRY">💧 DRY</button></div>
<div class="demo">ระบบจำลอง — ยังไม่ได้เชื่อมต่อเครื่องปรับอากาศจริง</div></div>
<script>
const scene=document.querySelector('a-scene'),target=document.querySelector('#target'),loading=document.querySelector('#loading'),loadingText=document.querySelector('#loadingText'),panel=document.querySelector('#controlPanel'),status=document.querySelector('#status'),arStatus=document.querySelector('#arStatus'),arTemp=document.querySelector('#arTemp'),temperature=document.querySelector('#temperature');
let temp=25,isOn=false;
function updateUI(){temperature.textContent=temp+'°C';arTemp.setAttribute('value',temp+'°C');if(isOn){status.innerHTML='🟢 สถานะ: ON';arStatus.setAttribute('value','ON');arStatus.setAttribute('color','#00ff66')}else{status.innerHTML='🔴 สถานะ: OFF';arStatus.setAttribute('value','OFF');arStatus.setAttribute('color','#ff3333')}}
scene.addEventListener('arReady',()=>{loading.style.display='none';panel.style.display='block'});
target.addEventListener('targetFound',()=>{panel.style.display='block'});
// FIX: keep controls visible even when the image target is temporarily lost
target.addEventListener('targetLost',()=>{panel.style.display='block'});
document.querySelector('#onButton').addEventListener('click',()=>{isOn=true;updateUI()});
document.querySelector('#offButton').addEventListener('click',()=>{isOn=false;updateUI()});
document.querySelector('#minusButton').addEventListener('click',()=>{temp=Math.max(16,temp-1);updateUI()});
document.querySelector('#plusButton').addEventListener('click',()=>{temp=Math.min(30,temp+1);updateUI()});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>console.log('Mode:',b.dataset.mode)));
scene.addEventListener('arError',()=>{loadingText.innerHTML='ไม่สามารถโหลด AR ได้<br>กรุณาตรวจสอบ targets.mind'});updateUI();
</script></body></html>
