<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>AR Smart Air</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }


    #loading {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background: #071a2f;

      color: white;

      z-index: 99999;

      text-align: center;

    }


    #loading h1 {

      font-size: 28px;

      margin-bottom: 10px;

    }


    #loading p {

      font-size: 16px;

      opacity: 0.8;

    }


    #controlPanel {

      position: fixed;

      left: 50%;

      bottom: 25px;

      transform: translateX(-50%);

      width: 300px;

      padding: 20px;

      background: rgba(0, 30, 60, 0.92);

      color: white;

      border-radius: 20px;

      text-align: center;

      z-index: 9999;

      display: none;

    }


    .title {

      font-size: 25px;

      font-weight: bold;

    }


    #status {

      margin: 15px;

      font-size: 20px;

    }


    #temperature {

      font-size: 40px;

      font-weight: bold;

      margin: 15px;

    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border: none;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

    }


    #onButton {

      background: #16a34a;

      color: white;

    }


    #offButton {

      background: #dc2626;

      color: white;

    }


  </style>

</head>


<body>


  <!-- Loading -->

  <div id="loading">

    <h1>❄️ SMART AIR</h1>

    <p id="loadingText">

      กำลังเตรียมระบบ AR...

    </p>

  </div>


  <!-- AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
      uiScanning: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>


    <!-- Marker -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">


      <a-text

        value="SMART AIR"

        align="center"

        color="#00e5ff"

        width="2"

        position="0 0.6 0">

      </a-text>


      <a-text

        value="25°C"

        align="center"

        color="#ffffff"

        width="2"

        position="0 0.25 0">

      </a-text>


      <a-text

        id="arStatus"

        value="OFF"

        align="center"

        color="#ff4444"

        width="2"

        position="0 -0.1 0">

      </a-text>


    </a-entity>


  </a-scene>


  <!-- Control -->

  <div id="controlPanel">


    <div class="title">

      ❄️ SMART AIR

    </div>


    <div id="status">

      🔴 สถานะ: OFF

    </div>


    <div id="temperature">

      25°C

    </div>


    <button id="onButton">

      🟢 เปิดแอร์

    </button>


    <button id="offButton">

      🔴 ปิดแอร์

    </button>


    <div style="font-size:12px;margin-top:10px;opacity:.7">

      DEMO MODE

    </div>


  </div>


  <script>


    const scene =

      document.querySelector("a-scene");


    const target =

      document.querySelector("#target");


    const loading =

      document.querySelector("#loading");


    const loadingText =

      document.querySelector("#loadingText");


    const panel =

      document.querySelector("#controlPanel");


    const status =

      document.querySelector("#status");


    const arStatus =

      document.querySelector("#arStatus");


    /*
     * MindAR เริ่มต้นสำเร็จ
     */

    scene.addEventListener(

      "arReady",

      function () {

        console.log("AR Ready");

        loading.style.display = "none";

      }

    );


    /*
     * เจอ Marker
     */

    target.addEventListener(

      "targetFound",

      function () {

        console.log("Target Found");

        panel.style.display = "block";

      }

    );


    /*
     * Marker หาย
     */

    target.addEventListener(

      "targetLost",

      function () {

        console.log("Target Lost");

        panel.style.display = "none";

      }

    );


    /*
     * เปิดแอร์
     */

    document

      .querySelector("#onButton")

      .addEventListener(

        "click",

        function () {

          status.innerHTML =
            "🟢 สถานะ: ON";

          arStatus.setAttribute(
            "value",
            "ON"
          );

          arStatus.setAttribute(
            "color",
            "#00ff66"
          );

        }

      );


    /*
     * ปิดแอร์
     */

    document

      .querySelector("#offButton")

      .addEventListener(

        "click",

        function () {

          status.innerHTML =
            "🔴 สถานะ: OFF";

          arStatus.setAttribute(
            "value",
            "OFF"
          );

          arStatus.setAttribute(
            "color",
            "#ff4444"
          );

        }

      );


    /*
     * Error
     */

    scene.addEventListener(

      "arError",

      function (event) {

        console.error(
          "AR Error",
          event
        );

        loadingText.innerHTML =
          "ไม่สามารถเริ่ม AR ได้<br>กรุณาตรวจสอบกล้องและ Marker";

      }

    );


  </script>


</body>

</html>
