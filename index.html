<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AR Smart Air</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #071a2f;
      color: white;

      text-align: center;
    }

    #loading h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    #loading p {
      margin: 0;
      font-size: 16px;
    }

    #controlPanel {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      width: 290px;
      padding: 20px;

      background: rgba(0, 35, 70, 0.92);

      color: white;

      border-radius: 20px;

      text-align: center;

      z-index: 10000;

      display: none;
    }

    .title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #status {
      font-size: 18px;
      margin: 12px;
    }

    #temperature {
      font-size: 42px;
      font-weight: bold;
      margin: 15px;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border: none;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;
    }

    #onButton {
      background: #16a34a;
      color: white;
    }

    #offButton {
      background: #dc2626;
      color: white;
    }

    .demo {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.7;
    }

  </style>

</head>


<body>


  <!-- Loading screen -->

  <div id="loading">

    <h1>❄️ SMART AIR</h1>

    <p id="loadingText">
      กำลังโหลดระบบ AR...
    </p>

  </div>


  <!-- ====================== -->
  <!-- AR SCENE -->
  <!-- ====================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
      enabled: false
    ">


    <!-- Camera -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- Target -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">


      <!-- AR title -->

      <a-text
        value="SMART AIR"
        align="center"
        color="#00e5ff"
        width="2"
        position="0 0.6 0">
      </a-text>


      <!-- Temperature -->

      <a-text
        value="25°C"
        align="center"
        color="#ffffff"
        width="2"
        position="0 0.25 0">
      </a-text>


      <!-- Status -->

      <a-text
        id="arStatus"
        value="OFF"
        align="center"
        color="#ff3333"
        width="2"
        position="0 -0.1 0">
      </a-text>


    </a-entity>


  </a-scene>


  <!-- ====================== -->
  <!-- CONTROL PANEL -->
  <!-- ====================== -->

  <div id="controlPanel">


    <div class="title">
      ❄️ SMART AIR
    </div>


    <div id="status">
      🔴 สถานะ: OFF
    </div>


    <div id="temperature">
      25°C
    </div>


    <button id="onButton">
      🟢 เปิดแอร์
    </button>


    <button id="offButton">
      🔴 ปิดแอร์
    </button>


    <div class="demo">
      DEMO MODE
    </div>


  </div>


  <!-- ====================== -->
  <!-- JAVASCRIPT -->
  <!-- ====================== -->

  <script>

    const scene =
      document.querySelector("a-scene");

    const target =
      document.querySelector("#target");

    const loading =
      document.querySelector("#loading");

    const loadingText =
      document.querySelector("#loadingText");

    const panel =
      document.querySelector("#controlPanel");

    const status =
      document.querySelector("#status");

    const arStatus =
      document.querySelector("#arStatus");


    /*
     * MindAR พร้อม
     */

    scene.addEventListener(
      "arReady",
      function () {

        console.log("MindAR Ready");

        loading.style.display = "none";

      }
    );


    /*
     * พบ Marker
     */

    target.addEventListener(
      "targetFound",
      function () {

        console.log("Marker Found");

        panel.style.display = "block";

      }
    );


    /*
     * Marker หาย
     */

    target.addEventListener(
      "targetLost",
      function () {

        console.log("Marker Lost");

        panel.style.display = "none";

      }
    );


    /*
     * เปิดแอร์
     */

    document
      .querySelector("#onButton")
      .addEventListener(
        "click",
        function () {

          status.innerHTML =
            "🟢 สถานะ: ON";

          arStatus.setAttribute(
            "value",
            "ON"
          );

          arStatus.setAttribute(
            "color",
            "#00ff66"
          );

        }
      );


    /*
     * ปิดแอร์
     */

    document
      .querySelector("#offButton")
      .addEventListener(
        "click",
        function () {

          status.innerHTML =
            "🔴 สถานะ: OFF";

          arStatus.setAttribute(
            "value",
            "OFF"
          );

          arStatus.setAttribute(
            "color",
            "#ff3333"
          );

        }
      );


    /*
     * กรณีโหลดไม่สำเร็จ
     */

    scene.addEventListener(
      "arError",
      function () {

        loadingText.innerHTML =
          "ไม่สามารถโหลด AR ได้<br>" +
          "กรุณาตรวจสอบ targets.mind";

      }
    );

  </script>


</body>

</html>
