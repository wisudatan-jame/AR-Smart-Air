<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HDD Factory Digital Twin (A-Frame)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ============================================================
       1. LIBRARIES (CDN only)
       A-Frame bundles three.js, so this one script is all we need.
       ============================================================ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- ============================================================
       2. ON-SCREEN HELP PANEL STYLES (desktop overlay only)
       ============================================================ -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }

    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      width: 300px; max-width: calc(100% - 32px);
      display: flex; flex-direction: column; gap: 10px;
    }
    .panel {
      background: rgba(31, 42, 56, 0.9);           /* same blue-gray family as the walls */
      color: #E8EEF4;
      border: 1px solid rgba(133, 183, 235, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px; line-height: 1.45;
    }
    .panel h1, .panel h2 { margin: 0 0 6px; font-weight: 500; }
    .panel h1 { font-size: 16px; }
    .panel h2 { font-size: 15px; }
    .panel p { margin: 0 0 8px; }
    .keys { list-style: none; margin: 0; padding: 0; color: #C9D6E2; }
    .keys li { margin: 3px 0; }
    kbd {
      display: inline-block; min-width: 18px; text-align: center;
      padding: 1px 5px; margin-right: 3px; border-radius: 4px;
      background: #2C3E55; border: 1px solid #4A6B8F; font: inherit; font-size: 12px;
    }
    #info { border-left: 3px solid #22D3EE; }   /* cyan = same colour as the flow arrows */
    #info[hidden] { display: none; }
    .info-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .phase { color: #22D3EE; margin-bottom: 4px; }
    .muted { color: #9FB0C2; font-size: 13px; margin: 0; }
    #info-close {
      background: transparent; color: #C9D6E2; cursor: pointer;
      border: 1px solid #4A6B8F; border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12px;
    }
    #info-close:focus-visible { outline: 2px solid #22D3EE; outline-offset: 2px; }
  </style>

  <!-- ============================================================
       3. CUSTOM A-FRAME COMPONENTS
       Components must be registered BEFORE <a-scene> is parsed,
       which is why this script lives in <head>.
       ============================================================ -->
  <script>
    // ---------- Shared settings -----------------------------------
    // Every machine and conveyor runs on the same 12-second "takt"
    // (one part leaves each machine every 12 seconds).
    const CYCLE = 12;
    const DEG = Math.PI / 180;            // degrees -> radians
    window.MACHINE_PHASE = {};            // current step text per machine (read by the info panel)

    // ---------- Small helpers --------------------------------------
    // Create an A-Frame element, give it attributes, add it to a parent.
    function make(tag, attrs, parent) {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) el.setAttribute(key, value);
      parent.appendChild(el);
      return el;
    }
    const lerp = (a, b, u) => a + (b - a) * u;
    const smooth = (u) => u * u * (3 - 2 * u);          // ease-in/ease-out curve
    const inWindows = (t, windows) => windows.some(([a, b]) => t >= a && t < b);

    // Change a mesh colour without calling setAttribute every frame (faster).
    function setColor(el, hex) {
      if (!el || el._lastColor === hex) return;
      const mesh = el.getObject3D('mesh');
      if (!mesh) return;
      mesh.material.color.set(hex);
      el._lastColor = hex;
    }
    // Make a flat "progress bar" plane grow from its left edge.
    function setBar(obj, frac, fullWidth, leftX) {
      obj.scale.x = Math.max(0.001, frac);
      obj.position.x = leftX + (fullWidth * frac) / 2;
    }

    // ---------- Robot keyframes ------------------------------------
    // k(time, label, J1 base yaw, J2 shoulder, J3 elbow, grip 0=open 1=closed, wrist roll)
    // Angles are in degrees. J1 = 0 faces the viewer (+Z); positive turns toward +X.
    // The wrist pitch is calculated automatically so the gripper always points down.
    function k(t, label, j1, j2, j3, grip, roll) {
      return { t, label, j: [j1, j2, j3], grip, roll: roll || 0 };
    }

    const ROBOT_CYCLES = {
      // M01: small blue arm - pick disk, weigh it, hand it to CV01
      m01: {
        fingerOpen: 0.06, fingerClosed: 0.035, autoRoll: false,
        keys: [
          k(0.0,  'Ready at home',                  0, 15, 100, 0),
          k(1.2,  'Moving to disk pick',          -62, 59,  53, 0),
          k(1.7,  'Lowering to disk',             -62, 69,  53, 0),
          k(2.1,  'Gripping disk',                -62, 69,  53, 1),
          k(2.7,  'Lifting disk',                 -62, 59,  53, 1),
          k(3.9,  'Moving to scale',                0, 45,  76, 1),
          k(4.4,  'Lowering onto scale',            0, 55,  76, 1),
          k(4.8,  'Releasing disk on scale',        0, 55,  76, 0),
          k(5.4,  'Clearing the scale',             0, 45,  76, 0),
          k(7.6,  'Weighing, load cell settling',   0, 45,  76, 0),
          k(8.1,  'Returning to weighed disk',      0, 55,  76, 0),
          k(8.5,  'Gripping weighed disk',          0, 55,  76, 1),
          k(9.1,  'Lifting weighed disk',           0, 45,  76, 1),
          k(10.3, 'Moving to CV01 hand-off',       62, 59,  53, 1),
          k(10.7, 'Lowering to hand-off nest',     62, 69,  53, 1),
          k(11.0, 'Releasing disk to CV01',        62, 69,  53, 0),
          k(12.0, 'Returning home',                 0, 15, 100, 0)
        ]
      },
      // M02: large 3-joint arm - pick platter, align over fixture, place
      m02: {
        fingerOpen: 0.08, fingerClosed: 0.06, autoRoll: false,
        keys: [
          k(0.0,  'Ready at home',                  0, 20, 100, 0, 0),
          k(1.2,  'Moving to platter nest',       -45, 47,  73, 0, 0),
          k(1.7,  'Lowering to platter',          -45, 60,  74, 0, 0),
          k(2.1,  'Gripping platter',             -45, 60,  74, 1, 0),
          k(2.7,  'Lifting platter',              -45, 47,  73, 1, 0),
          k(4.2,  'Moving above HDD fixture',       0, 28, 110, 1, 0),
          k(5.0,  'Aligning platter to spindle',    0, 28, 110, 1, 90),
          k(5.4,  'Fine alignment',               1.5, 28, 110, 1, 90),
          k(5.7,  'Fine alignment',                -1, 28, 110, 1, 90),
          k(6.0,  'Alignment locked',               0, 28, 110, 1, 90),
          k(7.0,  'Placing platter slowly',         0, 41, 113, 1, 90),
          k(7.4,  'Releasing platter',              0, 41, 113, 0, 90),
          k(8.0,  'Lifting clear',                  0, 28, 110, 0, 90),
          k(8.4,  'Resetting wrist',                0, 28, 110, 0, 0),
          k(9.4,  'Returning home',                 0, 20, 100, 0, 0),
          k(11.0, 'Shuttling drive to CV02',        0, 20, 100, 0, 0),
          k(12.0, 'Waiting for next platter',       0, 20, 100, 0, 0)
        ]
      },
      // M03: compact loader - unload tested drive, load new drive, run test
      // autoRoll keeps the carried HDD square to the line while the base turns.
      m03: {
        fingerOpen: 0.13, fingerClosed: 0.11, autoRoll: true,
        keys: [
          k(0.0,  'Opening chamber door',           0, 10, 110, 0),
          k(0.6,  'Chamber door open',              0, 10, 110, 0),
          k(1.4,  'Moving to test chamber',       180, 54,  56, 0),
          k(1.9,  'Reaching tested drive',        180, 64,  56, 0),
          k(2.2,  'Gripping tested drive',        180, 64,  56, 1),
          k(2.6,  'Pulling drive out',            180, 54,  56, 1),
          k(3.8,  'Moving to output lane',         90, 58,  56, 1),
          k(4.2,  'Lowering to output lane',       90, 68,  56, 1),
          k(4.5,  'Releasing tested drive',        90, 68,  56, 0),
          k(4.9,  'Lifting clear',                 90, 58,  56, 0),
          k(6.1,  'Moving to input lane',         -90, 58,  56, 0),
          k(6.5,  'Lowering to new drive',        -90, 68,  56, 0),
          k(6.8,  'Gripping new drive',           -90, 68,  56, 1),
          k(7.2,  'Lifting new drive',            -90, 58,  56, 1),
          k(8.0,  'Moving to test chamber',      -180, 54,  56, 1),
          k(8.4,  'Inserting drive',             -180, 64,  56, 1),
          k(8.7,  'Releasing drive in nest',     -180, 64,  56, 0),
          k(9.0,  'Withdrawing',                 -180, 54,  56, 0),
          k(9.6,  'Returning home',                 0, 10, 110, 0),
          k(10.0, 'Closing chamber door',           0, 10, 110, 0),
          k(11.8, 'Spin test running',              0, 10, 110, 0),
          k(12.0, 'Test passed',                    0, 10, 110, 0)
        ]
      }
    };

    // ---------- Parts that appear, disappear or slide ---------------
    // show: time windows when the part is visible
    // grow: time window where the part scales up from 0 (looks like it "arrives")
    // move: slide from one local position to another between t0 and t1
    const PROPS = {
      m01: [
        { id: 'm01-disk-pick',  show: [[0, 1.9], [11.5, 12]], grow: [11.5, 11.8] },
        { id: 'm01-disk-held',  show: [[1.9, 4.6], [8.3, 10.85]] },
        { id: 'm01-disk-scale', show: [[4.6, 8.3]] },
        { id: 'm01-disk-place', show: [[0, 0.8], [10.85, 12]] }
      ],
      m02: [
        { id: 'm02-platter-nest',   show: [[0, 1.9], [9.0, 12]], grow: [9.0, 9.3] },
        { id: 'm02-platter-held',   show: [[1.9, 7.2]] },
        { id: 'm02-platter-placed', show: [[7.2, 9.4]] },
        { id: 'm02-base',           show: [[0, 9.4], [11.0, 12]], grow: [11.0, 11.3] },
        { id: 'm02-out',            show: [[9.4, 11.0]],
          move: { t0: 9.4, t1: 11.0, from: [0, 0.936, 0], to: [2.6, 0.936, 0] } }
      ],
      m03: [
        { id: 'm03-hdd-nest', show: [[0, 2.05], [8.55, 12]] },
        { id: 'm03-hdd-held', show: [[2.05, 4.35], [6.65, 8.55]] },
        { id: 'm03-hdd-out',  show: [[4.35, 7.8]],
          move: { t0: 4.8, t1: 7.8, from: [0.75, 0.97, 0], to: [2.15, 0.97, 0] } },
        { id: 'm03-hdd-in',   show: [[0, 6.65]], grow: [0, 0.3],
          move: { t0: 0, t1: 3.0, from: [-2.15, 0.97, 0], to: [-0.75, 0.97, 0] } }
      ]
    };

    // ---------- Extra machine effects (lights, displays, spindle) ---
    const EFFECTS = {
      m01: {
        setup: (root) => ({
          platform: root.querySelector('#m01-platform').object3D,
          diskScale: root.querySelector('#m01-disk-scale').object3D,
          bar: root.querySelector('#m01-bar').object3D,
          led: root.querySelector('#m01-led')
        }),
        update(t, dt, fx) {
          const dip = (t >= 4.6 && t < 8.3) ? 0.005 : 0;    // platform sinks 5 mm under load
          fx.platform.position.y = 1.03 - dip;
          fx.diskScale.position.y = 1.056 - dip;
          let frac = 0;
          if (t >= 5.6 && t < 7.6) frac = (t - 5.6) / 2;
          else if (t >= 7.6 && t < 8.3) frac = 1;
          setBar(fx.bar, frac, 0.3, 1.05);
          setColor(fx.led, (t >= 5.6 && t < 7.6) ? '#EF9F27' : (t >= 7.6 && t < 8.3) ? '#2ECC71' : '#1E6FD9');
        }
      },
      m02: {
        setup: (root) => ({ led: root.querySelector('#m02-led') }),
        update(t, dt, fx) {
          setColor(fx.led, (t >= 4.2 && t < 7.2) ? '#378ADD' : '#2ECC71');   // blue while aligning
        }
      },
      m03: {
        setup: (root) => ({
          door: root.querySelector('#m03-door').object3D,
          spindle: root.querySelector('#m03-spindle').object3D,
          bar1: root.querySelector('#m03-bar1').object3D,
          bar2: root.querySelector('#m03-bar2').object3D,
          bar3: root.querySelector('#m03-bar3').object3D,
          led: root.querySelector('#m03-led')
        }),
        update(t, dt, fx) {
          // Door: opens 0-0.6 s, closes 9.6-10.0 s
          let open = 0;
          if (t < 0.6) open = t / 0.6;
          else if (t < 9.6) open = 1;
          else if (t < 10.0) open = 1 - (t - 9.6) / 0.4;
          fx.door.position.y = 1.28 + 0.36 * open;

          // Spin test: 10.0-11.8 s
          const testing = t >= 10.0 && t < 11.8;
          const passed = t >= 11.8 || t < 0.6;
          const rpm = testing ? Math.min(1, (t - 10.0) / 0.6) : 0;
          fx.spindle.rotation.y += (dt / 1000) * rpm * 25;

          setBar(fx.bar1, rpm, 0.6, 1.3);                                        // speed
          setBar(fx.bar2, testing ? 0.4 + 0.3 * (t - 10.0) / 1.8 : 0.35, 0.6, 1.3); // temperature
          setBar(fx.bar3, passed ? 1 : 0, 0.6, 1.3);                             // pass
          setColor(fx.led, testing ? '#EF9F27' : passed ? '#2ECC71' : '#5DCAA5');
        }
      }
    };

    // ---------- COMPONENT: robot-cycle -----------------------------
    // Put this on a machine. It finds the arm joints inside that machine
    // (.j1 .j2 .j3 .wrist .roll .finger-l .finger-r) and rotates them
    // through the keyframes above, every 12 seconds, forever.
    AFRAME.registerComponent('robot-cycle', {
      schema: { cycle: { type: 'string' } },

      init() {
        const q = (sel) => this.el.querySelector(sel).object3D;
        this.cfg = ROBOT_CYCLES[this.data.cycle];
        this.j1 = q('.j1'); this.j2 = q('.j2'); this.j3 = q('.j3');
        this.wrist = q('.wrist'); this.roll = q('.roll');
        this.fingerL = q('.finger-l'); this.fingerR = q('.finger-r');

        this.props = (PROPS[this.data.cycle] || []).map((p) => ({
          ...p, obj: this.el.querySelector('#' + p.id).object3D
        }));
        this.fxDef = EFFECTS[this.data.cycle];
        this.fx = this.fxDef ? this.fxDef.setup(this.el) : null;
      },

      tick(time, dt) {
        const t = (time / 1000) % CYCLE;     // seconds into the current cycle
        const keys = this.cfg.keys;

        // 1. Find the two keyframes we are between
        let i = 0;
        while (i < keys.length - 2 && t >= keys[i + 1].t) i++;
        const a = keys[i], b = keys[i + 1];
        const u = smooth(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));

        // 2. Blend the joint angles
        const j1 = lerp(a.j[0], b.j[0], u);
        const j2 = lerp(a.j[1], b.j[1], u);
        const j3 = lerp(a.j[2], b.j[2], u);
        const grip = lerp(a.grip, b.grip, u);
        const roll = lerp(a.roll, b.roll, u);

        // 3. Apply them: base -> shoulder -> elbow -> wrist -> gripper
        this.j1.rotation.y = j1 * DEG;                    // base yaw
        this.j2.rotation.x = j2 * DEG;                    // shoulder pitch
        this.j3.rotation.x = j3 * DEG;                    // elbow pitch
        this.wrist.rotation.x = (180 - (j2 + j3)) * DEG;  // keeps gripper pointing down
        this.roll.rotation.y = (this.cfg.autoRoll ? j1 : roll) * DEG;
        const f = lerp(this.cfg.fingerOpen, this.cfg.fingerClosed, grip);
        this.fingerL.position.x = -f;
        this.fingerR.position.x = f;

        window.MACHINE_PHASE[this.data.cycle] = b.label;

        // 4. Show, hide, grow and slide the parts
        for (const p of this.props) {
          const visible = inWindows(t, p.show);
          p.obj.visible = visible;
          if (!visible) continue;
          if (p.grow) {
            const g = (t - p.grow[0]) / (p.grow[1] - p.grow[0]);
            p.obj.scale.setScalar(t >= p.grow[0] && t < p.grow[1] ? Math.max(0.001, g) : 1);
          }
          if (p.move) {
            const m = p.move;
            const mu = smooth(Math.min(1, Math.max(0, (t - m.t0) / (m.t1 - m.t0))));
            p.obj.position.set(lerp(m.from[0], m.to[0], mu), lerp(m.from[1], m.to[1], mu), lerp(m.from[2], m.to[2], mu));
          }
        }

        // 5. Machine-specific lights and displays
        if (this.fx) this.fxDef.update(t, dt, this.fx);
      }
    });

    // ---------- COMPONENT: carrier-loop ----------------------------
    // Creates 3 HDD carriers on a conveyor and moves them continuously
    // in +X. At each end a carrier shrinks into / grows out of the port.
    AFRAME.registerComponent('carrier-loop', {
      schema: {
        x0: { type: 'number' }, x1: { type: 'number' }, z: { default: -2 },
        speed: { default: 0.12 },                 // metres per second
        load: { default: 'platter' },             // 'platter' or 'hdd'
        count: { default: 3 }
      },
      init() {
        const d = this.data;
        this.length = d.x1 - d.x0;
        this.carriers = [];
        for (let i = 0; i < d.count; i++) {
          // The group origin sits on the belt surface (y = 0.9), so shrinking looks natural.
          const group = make('a-entity', { position: `${d.x0} 0.9 ${d.z}` }, this.el);
          make('a-box', { width: 0.36, height: 0.04, depth: 0.5, color: '#C9CDD2', position: '0 0.02 0' }, group);
          if (d.load === 'platter') {
            make('a-cylinder', { radius: 0.03, height: 0.02, color: '#888780', position: '0 0.05 0', 'segments-radial': 8 }, group);
            make('a-cylinder', { radius: 0.1, height: 0.012, color: '#D3D1C7', metalness: 0.6, roughness: 0.3,
                                 position: '0 0.066 0', 'segments-radial': 16 }, group);
          } else {
            make('a-box', { width: 0.2, height: 0.06, depth: 0.3, color: '#4A4E54', position: '0 0.07 0' }, group);
          }
          // Evenly spaced along the belt
          this.carriers.push({ obj: group.object3D, offset: ((i + 0.5) * this.length) / d.count });
        }
      },
      tick(time) {
        const s = time / 1000;
        for (const c of this.carriers) {
          const dist = (c.offset + this.data.speed * s) % this.length;   // distance from belt start
          c.obj.position.x = this.data.x0 + dist;
          const edge = Math.min(dist, this.length - dist);              // distance to nearest end
          c.obj.scale.setScalar(Math.max(0.001, Math.min(1, edge / 0.25)));
        }
      }
    });

    // ---------- COMPONENT: floor-grid ------------------------------
    // Draws all 1 m grid lines as ONE object (one draw call = fast).
    AFRAME.registerComponent('floor-grid', {
      schema: { width: { default: 30 }, depth: { default: 20 }, step: { default: 1 }, color: { default: '#6B6E72' } },
      init() {
        const { width, depth, step, color } = this.data;
        const pts = [];
        for (let x = -width / 2; x <= width / 2 + 1e-6; x += step) {
          pts.push(new THREE.Vector3(x, 0, -depth / 2), new THREE.Vector3(x, 0, depth / 2));
        }
        for (let z = -depth / 2; z <= depth / 2 + 1e-6; z += step) {
          pts.push(new THREE.Vector3(-width / 2, 0, z), new THREE.Vector3(width / 2, 0, z));
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(pts);
        this.el.setObject3D('mesh', new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color })));
      },
      remove() { this.el.removeObject3D('mesh'); }
    });

    // ---------- Machine information (labels, click panel) ----------
    const MACHINES = {
      m01: {
        title: 'M01 - Precision Weighing',
        desc: 'The blue robot picks a disk, places it on the load-cell platform, waits for a stable reading, then hands it to CV01.',
        label: [0, 2.0, 1.25]
      },
      m02: {
        title: 'M02 - Robotic Assembly',
        desc: 'A large 3-joint robot picks a weighed platter, aligns it over the HDD base in the fixture, then places it.',
        label: [0, 2.75, 2.45]
      },
      m03: {
        title: 'M03 - Functional Test',
        desc: 'A compact robot unloads the tested drive, loads the next one into the chamber, then the spindle test runs.',
        label: [0, 2.55, 1.56]
      }
    };

    // ---------- COMPONENT: machine-info ----------------------------
    // Adds a name label above the machine and a details board that
    // appears when the machine is clicked (works on desktop and in VR).
    AFRAME.registerComponent('machine-info', {
      schema: { id: { type: 'string' } },
      init() {
        const info = MACHINES[this.data.id];
        const [lx, ly, lz] = info.label;

        // Always-visible name label
        const label = make('a-entity', { position: `${lx} ${ly} ${lz}` }, this.el);
        this.labelBg = make('a-plane', { width: 2.8, height: 0.36, color: '#1F2A38', opacity: 0.9, transparent: true, shader: 'flat' }, label);
        make('a-text', { value: info.title, align: 'center', width: 4, color: '#E8EEF4', position: '0 0 0.01' }, label);

        // Details board (hidden until clicked)
        this.board = make('a-entity', { position: `${lx} ${ly + 0.85} ${lz}`, visible: false }, this.el);
        make('a-plane', { width: 3.4, height: 1.1, color: '#1F2A38', opacity: 0.95, transparent: true, shader: 'flat' }, this.board);
        make('a-plane', { width: 3.4, height: 0.03, color: '#22D3EE', shader: 'flat', position: '0 0.535 0.005' }, this.board);
        make('a-text', { value: info.title, anchor: 'left', width: 3.2, 'wrap-count': 32, color: '#FFFFFF', position: '-1.55 0.33 0.01' }, this.board);
        make('a-text', { value: info.desc, anchor: 'left', width: 3.1, 'wrap-count': 52, color: '#C9D6E2', position: '-1.55 0.0 0.01' }, this.board);
        this.phaseText = make('a-text', { value: '', anchor: 'left', width: 3.1, 'wrap-count': 52, color: '#22D3EE', position: '-1.55 -0.38 0.01' }, this.board);

        // Mouse / laser events bubble up from the invisible click box
        this.el.addEventListener('click', () => selectMachine(this.data.id));
        this.el.addEventListener('mouseenter', () => {
          setColor(this.labelBg, '#0F6E56');
          const canvas = this.el.sceneEl.canvas; if (canvas) canvas.style.cursor = 'pointer';
        });
        this.el.addEventListener('mouseleave', () => {
          setColor(this.labelBg, '#1F2A38');
          const canvas = this.el.sceneEl.canvas; if (canvas) canvas.style.cursor = '';
        });

        // Update the board text only twice per second (cheap)
        this.tick = AFRAME.utils.throttleTick(this.updateBoard, 500, this);
      },
      updateBoard() {
        if (!this.board.object3D.visible) return;
        this.phaseText.setAttribute('value', 'Now: ' + (window.MACHINE_PHASE[this.data.id] || ''));
      },
      setOpen(open) { this.board.object3D.visible = open; }
    });

    // Called when a machine is clicked
    let selectedMachine = null;
    function selectMachine(id) {
      selectedMachine = (selectedMachine === id) ? null : id;     // click again to close
      for (const key of Object.keys(MACHINES)) {
        const el = document.getElementById(key);
        el.components['machine-info'].setOpen(key === selectedMachine);
      }
      const panel = document.getElementById('info');
      if (!selectedMachine) { panel.hidden = true; return; }
      document.getElementById('info-title').textContent = MACHINES[id].title;
      document.getElementById('info-desc').textContent = MACHINES[id].desc;
      panel.hidden = false;
    }
  </script>
</head>

<body>
  <!-- ============================================================
       4. DESKTOP HELP OVERLAY
       ============================================================ -->
  <div id="hud">
    <div class="panel">
      <h1>HDD line digital twin</h1>
      <p>Disks are weighed in M01, assembled into drives in M02 and spin-tested in M03. Cyan floor arrows show the material flow.</p>
      <ul class="keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</li>
        <li>Drag with the mouse to look around</li>
        <li>Click a machine to see what it is doing</li>
      </ul>
    </div>
    <div id="info" class="panel" hidden>
      <div class="info-head">
        <h2 id="info-title"></h2>
        <button id="info-close" type="button">Close</button>
      </div>
      <p id="info-desc"></p>
      <p class="phase">Now: <span id="info-phase"></span></p>
      <p class="muted">Cycle time 12 s, shared by the whole line</p>
    </div>
  </div>

  <!-- ============================================================
       5. THE 3D SCENE
       Units are metres. Y is up. +X is the production direction.
       +Z points toward the viewer. The line runs along z = -2.
       ============================================================ -->
  <a-scene
    renderer="antialias: true; foveationLevel: 1; highRefreshRate: true"
    shadow="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 80"
    background="color: #2A3340"
    loading-screen="dotsColor: #22D3EE; backgroundColor: #1F2A38">

    <!-- Reusable looks ("mixins") must live inside a-assets -->
    <a-assets>
      <a-mixin id="panel" material="color: #FAC775; opacity: 0.22; transparent: true; side: double; shader: flat; depthWrite: false"></a-mixin>
    </a-assets>

    <!-- ---------- Lights: only two real lights to stay fast ---------- -->
    <a-entity light="type: hemisphere; color: #DDE6F0; groundColor: #5A5F66; intensity: 0.95"></a-entity>
    <a-entity light="type: directional; color: #FFF6E0; intensity: 0.6" position="-6 12 8"></a-entity>

    <!-- ---------- Camera: mouse look + WASD; laser pointers in VR ---------- -->
    <a-entity id="rig" position="0 0 6.5">
      <a-entity id="camera" camera="near: 0.1; far: 200"
                look-controls="pointerLockEnabled: false"
                wasd-controls="acceleration: 22"
                position="0 1.6 0"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 30; lineColor: #22D3EE"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 30; lineColor: #22D3EE"></a-entity>
    </a-entity>

    <!-- ============================================================
         BUILDING: floor, grid, walls, ceiling
         ============================================================ -->

    <a-entity floor-grid="width: 30; depth: 20; step: 1; color: #6B6E72" position="0 0.003 0"></a-entity>

    <!-- Walls (front is left open so you can see in) -->
    <a-box position="0 4 -10.15"  width="30"  height="8" depth="0.3" color="#5B6B7D"></a-box>
    <a-box position="-15.15 4 0"  width="0.3" height="8" depth="20"  color="#5B6B7D"></a-box>
    <a-box position="15.15 4 0"   width="0.3" height="8" depth="20"  color="#5B6B7D"></a-box>
    <!-- Darker lower wall bands -->
    <a-box position="0 0.6 -9.98"  width="30"   height="1.2" depth="0.04" color="#46546A"></a-box>
    <a-box position="-14.98 0.6 0" width="0.04" height="1.2" depth="20"   color="#46546A"></a-box>
    <a-box position="14.98 0.6 0"  width="0.04" height="1.2" depth="20"   color="#46546A"></a-box>

    <!-- Ceiling faces down, so it is invisible from above -->
    <a-plane position="0 8 0" rotation="90 0 0" width="30" height="20" color="#3E4A59"></a-plane>
    <a-box position="0 7.8 -8" width="30" height="0.4" depth="0.3" color="#4A5563"></a-box>
    <a-box position="0 7.8 -3" width="30" height="0.4" depth="0.3" color="#4A5563"></a-box>
    <a-box position="0 7.8 2"  width="30" height="0.4" depth="0.3" color="#4A5563"></a-box>
    <a-box position="0 7.8 7"  width="30" height="0.4" depth="0.3" color="#4A5563"></a-box>

    <!-- ============================================================
         M01  PRECISION WEIGHING  (compact white / blue)

         ============================================================ -->

            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ============================================================

  <!-- ============================================================
       6. BUILD THE REPEATED PARTS WITH JAVASCRIPT
       Lights, safety markings, walkways, arrows and conveyors repeat
       many times, so small loops keep the file short and readable.
       ============================================================ -->
  <script>
    const scene = document.querySelector('a-scene');

    // ---------- Ceiling light fixtures (glowing boxes, not real lights) ----------
    for (const x of [-10, 0, 10]) {
      for (const z of [-5, 3]) {
        make('a-box', { position: `${x} 7.6 ${z}`, width: 3, height: 0.12, depth: 0.5, color: '#FFF6E0', shader: 'flat' }, scene);
      }
    }

    // ---------- Flat floor markings ----------
    // Each marking sits a few millimetres above the floor to avoid flicker.
    function floorPlane(x, z, w, d, color, y, extra) {
      return make('a-plane', Object.assign({
        position: `${x} ${y} ${z}`, rotation: '-90 0 0', width: w, height: d, color, shader: 'flat'
      }, extra || {}), scene);
    }

    // Safety zones: see-through yellow fill plus a solid yellow border
    const ZONES = [
      { x: -9, z: -2, w: 4.8, d: 4.0 },   // M01
      { x: 0,  z: -2, w: 7.1, d: 6.4 },   // M02
      { x: 9,  z: -2, w: 6.1, d: 4.6 }    // M03
    ];
    for (const zn of ZONES) {
      make('a-plane', { position: `${zn.x} 0.005 ${zn.z}`, rotation: '-90 0 0', width: zn.w, height: zn.d,
                        material: 'color: #F2C94C; opacity: 0.15; transparent: true; shader: flat; depthWrite: false' }, scene);
      floorPlane(zn.x, zn.z - zn.d / 2 + 0.05, zn.w, 0.1, '#F2C94C', 0.007);
      floorPlane(zn.x, zn.z + zn.d / 2 - 0.05, zn.w, 0.1, '#F2C94C', 0.007);
      floorPlane(zn.x - zn.w / 2 + 0.05, zn.z, 0.1, zn.d, '#F2C94C', 0.007);
      floorPlane(zn.x + zn.w / 2 - 0.05, zn.z, 0.1, zn.d, '#F2C94C', 0.007);
    }

    // Hazard lines along both sides of each conveyor
    for (const [x0, x1] of [[-6.6, -3.55], [3.55, 5.95]]) {
      for (const z of [-2.8, -1.2]) floorPlane((x0 + x1) / 2, z, x1 - x0, 0.08, '#F2C94C', 0.008);
    }

    // Main walking path (kept completely clear) and maintenance aisle
    floorPlane(0, 4.5, 28, 2, '#3FA34D', 0.006);
    floorPlane(0, 3.5, 28, 0.08, '#FFFFFF', 0.007);
    floorPlane(0, 5.5, 28, 0.08, '#FFFFFF', 0.007);
    floorPlane(0, -6.5, 28, 1.2, '#3FA34D', 0.006);
    // White chevrons on the walking path
    for (let x = -12; x <= 12; x += 4) {
      make('a-plane', { position: `${x} 0.008 4.35`, rotation: '-90 0 -31', width: 0.58, height: 0.12, color: '#FFFFFF', shader: 'flat' }, scene);
      make('a-plane', { position: `${x} 0.008 4.65`, rotation: '-90 0 31',  width: 0.58, height: 0.12, color: '#FFFFFF', shader: 'flat' }, scene);
    }

    // ---------- Cyan material-flow arrows ----------
    // Shaft = thin plane. Head = cylinder with only 3 sides (a triangle).
    for (const x of [-13.0, -5.8, -4.3, 4.2, 5.3, 13.0]) {
      floorPlane(x - 0.15, -0.7, 0.7, 0.12, '#22D3EE', 0.009);
      make('a-cylinder', { position: `${x + 0.28} 0.009 -0.7`, rotation: '0 90 0', radius: 0.22, height: 0.004,
                           'segments-radial': 3, color: '#22D3EE', shader: 'flat' }, scene);
    }

    // ---------- Conveyors ----------
    // Dark belt, metal side channels, polished guide rails, end drums,
    // box legs with a cross brace, and an optional drive motor.
    function buildConveyor({ x0, x1, legs, motor, carriers }) {
      const z = -2, length = x1 - x0, cx = (x0 + x1) / 2;
      const root = make('a-entity', {}, scene);

      make('a-box', { position: `${cx} 0.89 ${z}`, width: length, height: 0.02, depth: 0.6, color: '#2B2D30', roughness: 0.9 }, root);
      for (const side of [-0.33, 0.33]) {
        make('a-box', { position: `${cx} 0.84 ${z + side}`,  width: length, height: 0.12,  depth: 0.04,  color: '#9AA0A6', metalness: 0.3, roughness: 0.45 }, root);
        make('a-box', { position: `${cx} 0.913 ${z + side}`, width: length, height: 0.025, depth: 0.025, color: '#D3D1C7', metalness: 0.4, roughness: 0.3 }, root);
      }
      for (const dx of [x0 + 0.06, x1 - 0.06]) {
        make('a-cylinder', { position: `${dx} 0.84 ${z}`, rotation: '90 0 0', radius: 0.06, height: 0.62, color: '#B4B2A9', 'segments-radial': 10 }, root);
      }
      for (const lx of legs) {
        for (const side of [-0.3, 0.3]) {
          make('a-box', { position: `${lx} 0.39 ${z + side}`, width: 0.05, height: 0.78, depth: 0.05, color: '#7D8590' }, root);
        }
        make('a-box', { position: `${lx} 0.25 ${z}`, width: 0.04, height: 0.04, depth: 0.6, color: '#7D8590' }, root);
      }
      if (motor !== undefined) {
        make('a-box', { position: `${motor} 0.68 ${z - 0.47}`, width: 0.24, height: 0.16, depth: 0.2, color: '#3A3F45' }, root);
      }
      if (carriers) {
        root.setAttribute('carrier-loop', { x0, x1, z, speed: carriers.speed, load: carriers.load, count: 3 });
      }
    }

    // CV01: M01 -> M02 (weighed platters). CV02: M02 -> M03 (assembled drives).
    buildConveyor({ x0: -7.38, x1: -2.77, legs: [-7.1, -5.075, -3.05], motor: -3.3, carriers: { speed: 0.128, load: 'platter' } });
    buildConveyor({ x0: 2.77,  x1: 6.73,  legs: [3.05, 4.75, 6.45],    motor: 6.2,  carriers: { speed: 0.110, load: 'hdd' } });
    // Short infeed and outfeed stubs (no carriers)
    buildConveyor({ x0: -14.0, x1: -10.62, legs: [-13.7, -12.3, -10.9] });
    buildConveyor({ x0: 11.27, x1: 14.0,   legs: [11.55, 12.6, 13.7] });

    // ---------- Desktop info panel ----------
    document.getElementById('info-close').addEventListener('click', () => {
      if (selectedMachine) selectMachine(selectedMachine);   // same id again = close
    });
    // Refresh the "Now:" line a few times per second
    setInterval(() => {
      if (selectedMachine) {
        document.getElementById('info-phase').textContent = window.MACHINE_PHASE[selectedMachine] || '';
      }
    }, 250);
  </script>
